# Base：只定義服務與內部設定，不決定「對外怎麼曝露」。
# 對外方式由 override 決定：
#   - 本機開發   → compose.dev.yaml              （直接開 localhost:8000、熱重載）
#   - 部署       → deploy/compose.*.yaml         （三種模式擇一）
services:
  app:
    build: .
    # 映像名：本機 build 預設 python-app:latest；
    # 部署（make deploy）時傳入 IMAGE=ghcr.io/<帳號>/<repo>、TAG=<sha|v*> 改拉 CI 建好的映像
    image: ${IMAGE:-python-app}:${TAG:-latest}
    restart: unless-stopped
    # 依 APP_ENV 載入對應環境的設定檔（dev/qas/prod）
    env_file:
      - env/.env.${APP_ENV:-dev}
