name: Cleanup old images

# 每週清理舊映像：:sha 建置保留最近 10 個、保護 latest 與 v* 正式版、刪 untagged。
# 想先預覽會刪什麼：把 dry-run 設 true。
on:
  schedule:
    - cron: '0 3 * * 1'      # 每週一 03:00 UTC
  workflow_dispatch:          # 也可手動觸發

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          packages: python-docker-template-multienv   # repo 改名時要一起改
          keep-n-tagged: 10          # :sha 建置保留最近 10 個
          exclude-tags: latest,v*    # 保護 latest 與所有 v* 正式版
          delete-untagged: true      # 刪 untagged 孤兒版本
          dry-run: false
