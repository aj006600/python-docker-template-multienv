name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore:          # 純文件變更不觸發 build/deploy（PR 仍會跑測試）
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # ---------- CI：測試 ----------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --dev
      - run: uv run pytest -q

  # ---------- 建置一次：打不可變的 SHA 標籤 ----------
  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

  # ---------- 依序 promote 同一個 SHA 映像：dev → qas → prod ----------
  deploy-dev:
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - run: echo "部署映像 ${{ env.IMAGE }}:${{ github.sha }} 到 dev"
      # TODO: 換成實際部署指令（例：SSH 到主機 docker pull + compose up）

  deploy-qas:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: qas
    steps:
      - run: echo "部署映像 ${{ env.IMAGE }}:${{ github.sha }} 到 qas"
      # TODO: 換成實際部署指令

  deploy-prod:
    needs: deploy-qas
    runs-on: ubuntu-latest
    environment: production   # 在 GitHub 設定 required reviewers → 上 prod 需人工核准
    steps:
      - run: echo "部署映像 ${{ env.IMAGE }}:${{ github.sha }} 到 prod"
      # TODO: 換成實際部署指令
