name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore:          # 純文件變更不觸發 build/deploy（PR 仍會跑測試）
      - '**.md'
      - 'docs/**'
    tags: ['v*']           # 打 v* tag → 發版到 prod
  pull_request:
    branches: [main]

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # ---------- CI：測試（PR / main / tag 都跑）----------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --dev
      - run: uv run pytest -q

  # ========== merge 到 main：build + 自動部署 dev → qas（不含 prod）==========
  build:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}   # 不可變 SHA 標籤

  deploy-dev:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - run: echo "部署 ${{ env.IMAGE }}:${{ github.sha }} 到 dev"
      # TODO: 換成實際部署指令

  deploy-qas:
    needs: deploy-dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: qas
    steps:
      - run: echo "部署 ${{ env.IMAGE }}:${{ github.sha }} 到 qas"
      # TODO: 換成實際部署指令

  # ========== 打 v* tag：發版到 prod（同一個映像加版本標籤，不重 build）==========
  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 不重 build：把 tag 指到的 commit 的 :sha 映像，加上版本標籤（build-once）
      - run: |
          docker buildx imagetools create \
            --tag ${{ env.IMAGE }}:${{ github.ref_name }} \
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy-prod:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production   # 在 GitHub 設 required reviewers → 上 prod 需人工核准
    steps:
      - run: echo "發版 ${{ env.IMAGE }}:${{ github.ref_name }}（= :${{ github.sha }}）到 prod"
      # TODO: 換成實際部署指令
